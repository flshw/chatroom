<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 570" width="100%" role="img">
<title>v2 系统框架图 · 服务端与客户端分离</title>
<desc>左列为单文件客户端模块，中列为共享协议与网络通道，右列为独立 Node 服务端模块，两侧通过密文通道连接</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="570" fill="#ffffff"/>
<text x="40" y="30" font-size="15" font-weight="500" fill="#26215C">v2 系统框架 · 服务端与客户端分离</text>
<rect x="40" y="60" width="180" height="440" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="82" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">客户端 · 单 HTML</text>
<rect x="250" y="60" width="180" height="440" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="82" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">共享协议与通道</text>
<rect x="460" y="60" width="180" height="440" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="550" y="82" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#26215C">服务端 · Node.js</text>
<rect x="52" y="100" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="120" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">初始界面 用户名/IP</text>
<rect x="52" y="158" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="178" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">浏览器 ID + 时间戳</text>
<rect x="52" y="216" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="236" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">临时 RSA 密钥对</text>
<rect x="52" y="274" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="294" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">解封房间会话密钥</text>
<rect x="52" y="332" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="352" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">AES-GCM 消息收发</text>
<rect x="52" y="390" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="410" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">房间与私聊界面</text>
<rect x="52" y="448" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="468" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">代理 / 中继配置</text>
<rect x="262" y="100" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="120" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">shared/protocol.js</text>
<rect x="262" y="158" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="178" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">HELLO → WELCOME</text>
<rect x="262" y="216" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="236" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">REGISTER 加密注册</text>
<rect x="262" y="274" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="294" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">ROOM_* 指令集</text>
<rect x="262" y="332" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="352" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">MESSAGE 密文信封</text>
<rect x="262" y="390" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="410" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">WebSocket 直连</text>
<rect x="262" y="448" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="468" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">POST /relay 轮询</text>
<rect x="472" y="100" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<text x="550" y="120" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">RSA 密钥对自动生成</text>
<rect x="472" y="158" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<text x="550" y="178" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">内网 IP + 端口展示</text>
<rect x="472" y="216" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<text x="550" y="236" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">HTTP 托管 + 配置界面</text>
<rect x="472" y="274" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<text x="550" y="294" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">挑战应答 · 全新 UID</text>
<rect x="472" y="332" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<text x="550" y="352" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">会话密钥封装交付</text>
<rect x="472" y="390" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<text x="550" y="410" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">密文路由 · 成员管理</text>
<rect x="472" y="448" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<text x="550" y="468" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">sql.js 加密归档库</text>
<path d="M222 280 L248 280" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M432 280 L458 280" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="235" y="268" text-anchor="middle" font-size="11" fill="#5F5E5A">密文</text>
<text x="445" y="268" text-anchor="middle" font-size="11" fill="#5F5E5A">密文</text>
<text x="40" y="530" font-size="12" fill="#5F5E5A">蓝色 = 客户端侧　灰色 = 两端共用协议　紫色 = 服务端侧；传输与归档全程密文</text>
</svg>
