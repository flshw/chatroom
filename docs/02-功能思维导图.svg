<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="100%" role="img">
<title>局域网加密聊天室 v2 功能思维导图</title>
<desc>服务端与客户端分离后的功能分解：八个分支覆盖分发形态、服务端、客户端、身份注册、密钥体系、房间私聊、数据归档、接入代理</desc>
<defs>
