<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="470" fill="#ffffff"/>
<path d="M250 243 C232 243 232 90 216 90" fill="none" stroke="#85B7EB" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M250 243 C232 243 232 192 216 192" fill="none" stroke="#85B7EB" stroke-width="1" marker-end="url(#arrow)"/>
